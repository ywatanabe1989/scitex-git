name: tests
# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Replaces the formerly-inlined `test` matrix job with a thin `uses:` call
# into scitex-ai/.github's `pytest-matrix` reusable workflow — same job
# body (fallback-chain install + pytest + Codecov upload), now centrally
# maintained. Triggers preserved verbatim from the prior local file.
#
# New required-status-check context: "pytest-matrix / pytest-matrix-on-ubuntu-py<X.YY>"
# (previously just "pytest-matrix-on-ubuntu-py<X.YY>" with no caller-job
# prefix) — branch protection updated as part of this PR where needed.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  pytest-matrix:
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit
