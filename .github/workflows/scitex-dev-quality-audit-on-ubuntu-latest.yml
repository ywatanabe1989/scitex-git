name: quality
# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Replaces the formerly-inlined `audit` job with a thin `uses:` call into
# scitex-ai/.github's `quality-audit` reusable workflow — same job body
# (`scitex-dev ecosystem audit-all`), now centrally maintained. Triggers
# preserved verbatim from the prior local file.
#
# New required-status-check context: "quality-audit / audit"
# (previously just "audit" with no caller-job prefix) — branch protection
# updated as part of this PR where needed.
#
# NOTE: the reusable `quality-audit` runs
# `scitex-dev ecosystem audit-all "$DIST" --path "$PWD"` (no
# `--no-version-check`), whereas the prior inline `audit` job passed
# `--no-version-check`. Worth watching the first run for a new
# version-check-related failure mode that didn't exist before.

on:
  schedule:
    - cron: "0 18 * * *"  # 18:00 UTC (~03:00 JST), after Test
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/scitex-dev-quality-audit-on-ubuntu-latest.yml"
  pull_request:
    branches: [main, develop]

jobs:
  quality-audit:
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit
